name: Bug Report
description: 버그 제보용 이슈 템플릿
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: bug-summary
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 작성해주세요.
      placeholder: 예) 지수 데이터 저장 시 500 에러가 발생합니다.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 버그를 재현하는 절차를 순서대로 작성해주세요.
      placeholder: |
        1. /indexes API 호출
        2. 특정 값 입력
        3. 에러 발생
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상 결과
      description: 원래 기대한 동작을 작성해주세요.
      placeholder: 예) 정상적으로 저장되어야 합니다.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
      description: 실제로 어떤 결과가 발생했는지 작성해주세요.
      placeholder: 예) 500 Internal Server Error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 스크린샷
      description: 에러 로그, 스크린샷이 있으면 첨부해주세요.
      placeholder: stack trace, 화면 캡처 등